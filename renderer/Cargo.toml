[package]
name = "reel-renderer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fframes = { version = "=1.3.0", features = ["compile-time-svgtree", "cli"] }
fframes_skia_renderer = { version = "=1.3.0", features = ["metal"] }
fframes_native_player = { version = "=1.3.0", default-features = false, features = ["metal", "audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"

[target.'cfg(not(windows))'.dependencies]
fframes = { version = "=1.3.0", features = ["videotoolbox", "libav-agree-gpl"] }

[lib]
name = "reel_renderer"
path = "src/engine.rs"
doctest = false

[[bin]]
name = "reel-renderer"
path = "src/main.rs"

[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
